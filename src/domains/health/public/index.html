<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health - Public</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333; 
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container { 
            max-width: 600px; 
            background: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }
        h1 { 
            color: #667eea; 
            margin-bottom: 20px; 
            font-size: 36px;
        }
        p { 
            color: #666; 
            margin-bottom: 30px; 
            font-size: 18px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a {
            display: inline-block;
            padding: 15px 30px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        a:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f7f7f7;
            border-radius: 6px;
            text-align: left;
        }
        .info h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        code {
            background: #e0e0e0;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏥 Health Domain</h1>
        <p>Welcome to the public health page!</p>
        
        <div class="links">
            <a href="/health">API Health Check</a>
            <a href="/health/dashboard?key=dev-admin-secret-change-in-production">Admin Dashboard</a>
            <a href="/health/test.html">Test Page Example</a>
        </div>

        <div class="info">
            <h3>📂 Static Files</h3>
            <p>All HTML files in <code>src/domains/health/public/</code> are automatically served under <code>/health/</code> route.</p>
            <p style="margin-top: 10px;">Example: <code>public/test.html</code> → <code>/health/test.html</code></p>
        </div>
    </div>
</body>
</html>
