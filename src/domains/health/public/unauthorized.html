<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unauthorized - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f5f5f5; 
            color: #333; 
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container { 
            max-width: 600px; 
            margin: 20px;
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { color: #e74c3c; margin-bottom: 15px; font-size: 28px; }
        p { color: #7f8c8d; margin-bottom: 15px; font-size: 16px; }
        .code-block {
            background: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 4px;
            margin: 20px 0;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            text-align: left;
        }
        .warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 14px;
        }
        .info {
            background: #d1ecf1;
            border: 1px solid #17a2b8;
            color: #0c5460;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 14px;
            text-align: left;
        }
        .info strong { display: block; margin-bottom: 10px; }
        #envMode { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <h1>Access Denied</h1>
        <p>You need a valid admin key to access this dashboard.</p>
        
        <div class="info">
            <strong>How to access:</strong>
            Add <code>?key=YOUR_SECRET</code> to the URL:
            <div class="code-block" id="exampleUrl">http://localhost:8080/health/dashboard?key=YOUR_SECRET</div>
        </div>
        
        <div id="envMode" class="warning">
            <strong>⚠️ Development Mode</strong><br>
            Using default admin secret. Set <code>ADMIN_SECRET</code> environment variable in production!
        </div>
    </div>

    <script>
        // Get mode from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const mode = urlParams.get('mode');
        const isDev = mode === 'dev';
        
        // Update example URL based on mode
        const exampleUrl = isDev 
            ? "http://localhost:8080/health/dashboard?key=dev-admin-secret-change-in-production"
            : "https://your-domain.com/health/dashboard?key=YOUR_SECRET";
        
        document.getElementById('exampleUrl').textContent = exampleUrl;
        
        // Show development warning if in dev mode
        if (isDev) {
            document.getElementById('envMode').style.display = 'block';
        }
    </script>
</body>
</html>
